<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Shop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a4a 100%);
            display: flex;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            width: 100%;
            max-width: 380px;
        }

        #main {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        #main h1 {
            font-size: 26px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #6c8bff, #b06cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #main img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            margin: 10px auto 20px;
            display: block;
            filter: drop-shadow(0 10px 20px rgba(108, 139, 255, 0.4));
            transition: transform 0.3s;
        }

        #main img:hover {
            transform: scale(1.05);
        }

        #main p {
            font-size: 15px;
            line-height: 1.6;
            color: #c5c8d6;
            margin-bottom: 28px;
        }

        #buy {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(90deg, #6c8bff, #b06cff);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(108, 139, 255, 0.35);
        }

        #buy:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(176, 108, 255, 0.5);
        }

        #buy:active {
            transform: translateY(0);
            box-shadow: 0 5px 15px rgba(108, 139, 255, 0.3);
        }

           #form {
    display: none;
    width: 100%;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    flex-directi

        #form input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
        }

        #form input::placeholder {
            color: #888ea0;
        }

        #form input:focus {
            border-color: #6c8bff;
            background: rgba(108, 139, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(108, 139, 255, 0.2);
        }

        #form input:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }

        #order {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(90deg, #6c8bff, #b06cff);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(108, 139, 255, 0.35);
        }

        #order:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(176, 108, 255, 0.5);
        }

        #order:active {
            transform: translateY(0);
            box-shadow: 0 5px 15px rgba(108, 139, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div id="main">
            <h1>Онлайн магазин</h1>
            <img src="https://cdn-icons-png.flaticon.com/512/3595/3595455.png" alt="shop">
            <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Accusantium ipsum magni, molestias.</p>
            <button id="buy">Купить</button>
        </div>

        <form id="form">
            <input type="text" placeholder="Имя" id="user_name">
            <input type="text" placeholder="Email" id="user_email">
            <input type="text" placeholder="Телефон" id="user_phone">
            <div id="error"></div>
            <button id="order">Оформить</button>
        </form>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script>
      let tg = window.Telegram.WebApp;
      let buy = document.getElementById("buy");
      let order = document.getElementById("order");
      tg.expand();

      buy.addEventListener("click", () =>
      {
          document.getElementById("main").style.display = "none";
          document.getElementById("form").style.display = "block";
          document.getElementById("user_name").value=tg.initDataUnsafe.user.first_name + " " + tg.initDataUnsafe.user.last_name;
      });
      order.addEventListener("click", () => {
          document.getElementById("error").innerText = '';
          let name = document.getElementById("user_name").value;
          let email =document.getElementById("user_email").value;
          let phone = document.getElementById("user_phone").value;
          if(name.length < 5) {
        document.getElementById("error").innerText = 'Ошибка в имени';
        return;
        }
            if(email.length < 5) {
        document.getElementById("error").innerText = 'Ошибка в email';
        return;
        }
            if(phone.length < 5) {
        document.getElementById("error").innerText = 'Ошибка в номере телефона';
        return;
        }

            let data ={
                name: name,
                email: email,
                phone: phone
            }
            tg.sendData(JSON.stringify(data));

         tg.close();
      });

    </script>
</body>
</html>
